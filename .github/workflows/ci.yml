name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: JVM 单元测试
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Gradle 8.13
        # 不用 ./gradlew：仓库的 wrapper 在某些网络环境下取不到发行包。
        # 这里按 gradle-wrapper.properties 指定的同一版本直接下载安装，
        # curl 走 runner 的网络代理策略，比 wrapper 自带的 Java 下载器稳。
        run: |
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: gradle --version | head -6

      - name: Run unit tests
        # 只跑 JVM 单元测试，不打包 APK：不需要签名密钥，
        # 也不会触发 Compose UI 的完整编译。
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
